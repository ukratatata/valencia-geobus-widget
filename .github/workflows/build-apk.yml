name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: valencia-geobus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: València GeoBus Widget v1.0.0 (One UI 8.5)
          body: |
            ### 🚌 València GeoBus Widget v1.0.0
            Compilación directa y lista para instalar en tu **Samsung Galaxy S24 Ultra** (Android 16, One UI 8.5).
            
            #### 📥 Instrucciones de Instalación:
            1. Descarga el archivo `app-debug.apk` adjunto directamente a tu teléfono móvil.
            2. Toca la notificación o abre el archivo desde la app "Mis Archivos" de Samsung.
            3. Si el sistema te pide confirmación por ser de origen desconocido, pulsa **"Instalar de todas formas"** (la app es 100% segura, de código abierto e inviolable).
            4. Abre la app, pulsa en Ajustes y concede **"Permitir todo el tiempo"** para que el widget pueda leer el GPS desde la pantalla de inicio.
            5. Mantén pulsada la pantalla de inicio > Widgets > añade **València GeoBus**.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
