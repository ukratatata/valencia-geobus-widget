name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: valencia-geobus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: València GeoBus Widget v1.0.0 (One UI 8.5)
          body: |
            ### 🚌 València GeoBus Widget v1.0.0
            Compilación automática lista para instalar en tu **Samsung Galaxy S24 Ultra** (Android 16, One UI 8.5).
            
            #### 📥 Instalación:
            1. Descarga el archivo `app-debug.apk` adjunto directamente desde tu móvil.
            2. Pulsa en el archivo descargado para instalarlo.
            3. Si Samsung / Play Protect muestra un aviso de *"App de origen desconocido"* o *"Desarrollador desconocido"*, pulsa **"Instalar de todas formas"** (es completamente seguro, tu código es 100% abierto y auditable).
            4. Abre la app, pulsa en Ajustes y concede **"Permitir todo el tiempo"** en Ubicación.
            5. Añade el widget a tu pantalla de inicio y ¡listo!
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
